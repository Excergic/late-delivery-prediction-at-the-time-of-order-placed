[project]
name = "supply-chain-ml-system"
version = "0.1.0"
description = "Late delivery risk prediction for supply chain operations"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Orchestration + experiment tracking + model registry
    "zenml[server,mlflow]==0.92.0",
    # Drift detection
    "evidently==0.7.21",
    # ML
    "scikit-learn==1.8.0",
    "lightgbm==4.6.0",
    # Data
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # Experiment tracking
    "mlflow==3.11.1",
    # Serialization
    "joblib>=1.3.0",
    # Config
    "pyyaml>=6.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
